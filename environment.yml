name: beckmann
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - rdkit>=2022.03.1
  - numpy
  - pandas
  - matplotlib
  - pillow
  - pip
  - pip:
    - auto3d
    - torch
    - tqdm
    - psutil
    - pyyaml
    - "aimnet[ase]"
    # Editable installs for both packages -- beckmann-nbo pulls in
    # beckmann-core automatically via its own pyproject.toml dependency.
    - -e ./packages/beckmann-core
    - -e ./packages/beckmann-nbo
