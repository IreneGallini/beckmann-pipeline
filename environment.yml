name: beckmann
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - rdkit>=2022.03.1
  - numpy
  - pandas
  - matplotlib
  - pillow
  - pip
  - pip:
    - auto3d
    - torch
    - tqdm
    - psutil
    - pyyaml
    - "aimnet[ase]"
    - pyscf
    - flask
    # Editable installs for all three packages -- see CLAUDE.md for why the
    # monorepo is split this way. beckmann-nbo/beckmann-pyscf both pull in
    # beckmann-core automatically via their own pyproject.toml dependency.
    - -e ./packages/beckmann-core
    - -e ./packages/beckmann-nbo
    - -e ./packages/beckmann-pyscf
