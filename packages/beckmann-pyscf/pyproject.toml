[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "beckmann-pyscf"
version = "0.1.0"
description = "Open-source, HPC-free Beckmann rearrangement predictor: SMILES -> AIMNet2 geometry -> PySCF-native wCNmax scan -> R/F prediction. Flask web UI. No Gaussian, no NBO7, no Citadel."
requires-python = ">=3.11"
dependencies = [
    "beckmann-core==0.1.0",
    "pyscf==2.13.1",
    "flask==3.1.3",
    "gunicorn==26.0.0",
    "flask-limiter==4.1.1",
    "flask-cors==6.0.5",
    "matplotlib",
]

[project.scripts]
beckmann-pyscf = "beckmann_pyscf.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["beckmann_pyscf*"]

[tool.setuptools.package-data]
beckmann_pyscf = ["engine/basis_data/*.dat"]
